[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofwriter-vgcf"
version = "0.1.0"
description = "Selective neuro-symbolic reasoning on ProofWriter: AI course project portfolio"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Ye Lei"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vgcf-run = "vgcf.cli:run_main"
vgcf-analyze = "vgcf.cli:analyze_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
